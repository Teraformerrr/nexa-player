appId: com.nexaplayer.desktop
productName: Nexa Player

directories:
  buildResources: build
  output: dist/windows

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!resources/mpv/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

extraResources:
  - from: resources/mpv
    to: mpv
    filter:
      - '**/*'

fileAssociations:
  - ext:
      - mp4
      - mkv
      - webm
      - mov
      - avi
      - m4v
      - ts
      - m2ts
      - mts
      - mpg
      - mpeg
      - wmv
      - flv
      - ogv
      - 3gp
    name: Nexa Player Video
    description: Video media supported by Nexa Player
    role: viewer
    icon: build/icon.ico
  - ext: 
      - mp3
      - flac
      - wav
      - m4a
      - aac
      - ogg
      - opus
      - wma
    name: Nexa Player Audio
    description: Audio media supported by Nexa Player
    role: viewer
    icon: build/icon.ico

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  executableName: nexa-player
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Nexa-player-${version}-Setup.${ext}
  shortcutName: Nexa Player
  uninstallDisplayName: Nexa Player
  createDesktopShortcut: true


npmRebuild: false

publish:
  provider: github
  owner: Teraformerrr
  repo: nexa-player